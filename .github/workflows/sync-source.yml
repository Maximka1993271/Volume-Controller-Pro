name: Sync extension source into main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-source.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download and validate the published v4.7.90 source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/volume-controller-pro.zip"
          extract_dir="$RUNNER_TEMP/volume-controller-pro"
          curl --fail --location --retry 3 \
            "https://github.com/Maximka1993271/Volume-Controller-Pro/releases/download/v4.7.90/Volume.Controller.Pro.v4.7.90.zip" \
            --output "$archive"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          manifest_path="$(find "$extract_dir" -type f -name manifest.json -print -quit)"
          test -n "$manifest_path" || { echo "manifest.json was not found in the downloaded archive"; unzip -l "$archive" | head -80; exit 2; }
          source_root="$(dirname "$manifest_path")"
          MANIFEST_PATH="$manifest_path" node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH,'utf8')); if(m.version!=='4.7.90'||m.manifest_version!==3) process.exit(2); console.log('Validated version',m.version,'from',process.env.MANIFEST_PATH)"
          for file in background.js content.js offscreen.html offscreen.js popup.css popup.html popup.js styles.css _locales/en/messages.json _locales/ru/messages.json _locales/uk/messages.json lang/en.json lang/ru.json lang/uk.json icons/icon16.png icons/icon48.png icons/icon128.png; do
            test -f "$source_root/$file" || { echo "Missing required source file: $source_root/$file"; find "$extract_dir" -maxdepth 3 -type f | sort | head -100; exit 3; }
          done
          for item in _locales icons lang background.js content.js offscreen.html offscreen.js popup.css popup.html popup.js styles.css manifest.json; do
            cp -a "$source_root/$item" ./
          done

      - name: Update README for the synchronized source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("README.md")
          content = p.read_text(encoding="utf-8")
          content, count = re.subn(
              r"(?m)^> .*Repository status:.*$",
              "> **Repository status:** The complete extension source tree is available in the main branch, with manifest.json at the repository root. You can download the repository as a ZIP or use the Releases page for a versioned package.",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the repository status note in README.md.")
          content, count = re.subn(
              r"Because the full source tree is not yet present.*",
              "The extension source files are available in this repository for inspection. Audio processing is intended to run locally; review manifest.json and the source before installing.",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the outdated privacy note in README.md.")
          content, count = re.subn(
              r"The main branch currently contains.*",
              "The main branch contains the unpacked extension source, including manifest.json, JavaScript, HTML, CSS, localized messages, and icons. You can install from a cloned repository or from the repository ZIP.",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the outdated installation note in README.md.")
          p.write_text(content, encoding="utf-8")
          PY

      - name: Refresh repository structure in README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          content = p.read_text(encoding="utf-8")
          start = "    Volume-Controller-Pro/\n"
          end = "    └── README.md                       # Project overview\n"
          if start not in content or end not in content:
              raise SystemExit("README repository structure block was not found.")
          a = content.index(start)
          b = content.index(end, a) + len(end)
          tree = """    Volume-Controller-Pro/
          ├── _locales/                      # Browser manifest localization
          │   ├── en/messages.json
          │   ├── ru/messages.json
          │   └── uk/messages.json
          ├── icons/                         # Extension icons and favicons
          ├── lang/                          # Interface translations
          │   ├── en.json
          │   ├── ru.json
          │   └── uk.json
          ├── Readme/
          │   ├── Readme.md                 # Detailed audit and change report
          │   └── RELEASE_DESCRIPTION_v4.7.90.md
          ├── screenshots/                   # Interface screenshots
          ├── background.js                  # Extension service worker
          ├── content.js                     # Page content integration
          ├── offscreen.html
          ├── offscreen.js                   # Audio processing
          ├── popup.css
          ├── popup.html
          ├── popup.js
          ├── styles.css
          ├── manifest.json                  # Extension manifest (root)
          ├── LICENSE
          └── README.md
          """
          # normalize indentation introduced by the multiline literal
          tree = "\n".join(line[10:] if line.startswith("          ") else line for line in tree.splitlines()) + "\n"
          content = content[:a] + tree + content[b:]
          p.write_text(content, encoding="utf-8")
          PY

      - name: Validate source files and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check background.js
          node --check content.js
          node --check offscreen.js
          node --check popup.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "4.7.90"
          for path in Path("_locales").glob("*/messages.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("lang").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("Manifest and localization JSON validated.")
          PY
          rm -f .github/workflows/sync-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Volume Controller Pro v4.7.90 source files"
          git push origin HEAD:main
