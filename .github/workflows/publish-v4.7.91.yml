name: Publish Volume Controller Pro 4.7.92

on:
  push:
    branches: [main]
    # Rebuild whenever any file packaged into the release ZIP changes.
    paths:
      - ".github/workflows/publish-v4.7.92.yml"
      - "AUTO_GENRE_CATALOG.md"
      - "_locales/**"
      - "background.js"
      - "content.js"
      - "icons/**"
      - "lang/**"
      - "manifest.json"
      - "offscreen.html"
      - "offscreen.js"
      - "popup.css"
      - "popup.html"
      - "popup.js"
      - "styles.css"
      - "Readme/RELEASE_DESCRIPTION_v4.7.92.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v4.7.92
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version and source files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("version") == "4.7.92", f"Unexpected version: {manifest.get('version')}"
          required = [
              "AUTO_GENRE_CATALOG.md", "_locales", "background.js", "content.js",
              "icons", "lang", "manifest.json", "offscreen.html", "offscreen.js",
              "popup.css", "popup.html", "popup.js", "styles.css",
          ]
          missing = [name for name in required if not Path(name).exists()]
          assert not missing, f"Missing package files: {missing}"
          assert Path("Readme/RELEASE_DESCRIPTION_v4.7.92.md").is_file()
          print("Validated Volume Controller Pro 4.7.92 source tree.")
          PY

      - name: Package extension and create checksum
        run: |
          set -euo pipefail
          mkdir -p dist/package/"Volume Controller Pro"
          cp -a AUTO_GENRE_CATALOG.md _locales background.js content.js icons lang manifest.json offscreen.html offscreen.js popup.css popup.html popup.js styles.css dist/package/"Volume Controller Pro"/
          (
            cd dist/package
            zip -qr ../Volume.Controller.Pro.v4.7.92.zip "Volume Controller Pro"
          )
          cd dist
          sha256sum Volume.Controller.Pro.v4.7.92.zip > Volume.Controller.Pro.v4.7.92.zip.sha256
          # Fail before publishing if the archive is corrupt or its checksum does not match.
          unzip -t Volume.Controller.Pro.v4.7.92.zip >/dev/null
          sha256sum -c Volume.Controller.Pro.v4.7.92.zip.sha256
          ls -lh Volume.Controller.Pro.v4.7.92.zip Volume.Controller.Pro.v4.7.92.zip.sha256

      - name: Attach verified ZIP and checksum to this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Volume.Controller.Pro.v4.7.92-audited
          path: |
            dist/Volume.Controller.Pro.v4.7.92.zip
            dist/Volume.Controller.Pro.v4.7.92.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Update an existing v4.7.92 release when one is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never create a release or tag automatically. Until v4.7.92 is published,
          # the verified ZIP and checksum remain available as this workflow artifact.
          if gh release view v4.7.92 >/dev/null 2>&1; then
            gh release upload v4.7.92 \
              dist/Volume.Controller.Pro.v4.7.92.zip \
              dist/Volume.Controller.Pro.v4.7.92.zip.sha256 \
              --clobber
            gh release edit v4.7.92 \
              --title "Volume Controller Pro 4.7.92" \
              --notes-file Readme/RELEASE_DESCRIPTION_v4.7.92.md
            gh release view v4.7.92
          else
            echo "No v4.7.92 release exists yet; no tag or release was created."
          fi
