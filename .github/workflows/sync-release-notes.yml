name: Sync v4.7.91 release notes

on:
  push:
    branches: [main]
    paths:
      - "Readme/RELEASE_DESCRIPTION_v4.7.91.md"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s Readme/RELEASE_DESCRIPTION_v4.7.91.md
          gh release view v4.7.91 >/dev/null
          gh release edit v4.7.91 --notes-file Readme/RELEASE_DESCRIPTION_v4.7.91.md
